name: Hotfix

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to cherry-pick'
        required: true
        type: string

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: 2271240 # joy-github-app
          private-key: ${{ secrets.JOY_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for cherry-pick
      
      - run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}"
          git config user.email "${{ steps.app-token.outputs.app-slug }}@users.noreply.github.com"
          git checkout prod
          git pull origin prod
          git cherry-pick ${{ inputs.commit_hash }}
        continue-on-error: false
      
      - run: |
          git push origin prod

